<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Open in ITK-SNAP</title>
  <style>
    /* Transparent and empty until connected, so the initial full-size frame shows nothing */
    html, body { background: transparent; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 12px 24px; color: #222; font-size: 14px; }
    p { margin: 0; }
    .error { color: #b00020; }
    .hint { color: #666; margin-bottom: 8px; }
    #refreshing { color: #999; font-style: italic; margin-left: 6px; }
    #refreshing[hidden] { display: none; }

    #list[hidden] { display: none; }
    section { margin-bottom: 14px; }
    h2 {
      font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
      color: #555; margin: 0 0 4px; padding-bottom: 3px; border-bottom: 1px solid #ddd;
    }
    h2 .count { font-weight: 400; color: #888; }
    ul { list-style: none; margin: 0; padding: 0; }
    li a {
      display: flex; align-items: baseline; gap: 12px;
      padding: 5px 8px; border-radius: 4px; color: #1a56a8; text-decoration: none;
    }
    li a:hover, li a:focus-visible { background: #eaf1fb; outline: none; }
    .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .meta { color: #888; font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    li.source { color: #555; font-size: 12px; font-weight: 600; padding: 8px 8px 2px; }
    .empty { color: #888; font-style: italic; padding: 5px 8px; }
    li[hidden], .empty[hidden] { display: none; }

    .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 6px; }
    .filters[hidden] { display: none; }
    .chip {
      font: inherit; font-size: 12px; cursor: pointer;
      padding: 2px 10px; border-radius: 12px;
      border: 1px solid #1a56a8; background: #eaf1fb; color: #1a56a8;
    }
    .chip[aria-pressed="false"] { border-color: #ccc; background: transparent; color: #999; text-decoration: line-through; }
    .chip .n { color: inherit; opacity: .7; margin-left: 4px; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <p id="status"></p>

  <div id="list" hidden>
    <p class="hint">Choose a workspace or image to open in ITK-SNAP. <span id="refreshing" hidden>Checking for changes…</span></p>
    <section>
      <h2>ITK-SNAP workspaces <span class="count" id="ws-count"></span></h2>
      <ul id="workspaces"></ul>
    </section>
    <section>
      <h2>Images <span class="count" id="img-count"></span></h2>
      <div class="filters" id="ext-filter" role="group" aria-label="Show images by file type" hidden></div>
      <ul id="images"></ul>
      <p class="empty" id="img-none" hidden>No images of the selected types</p>
    </section>
  </div>

  <script src="https://cdn.flywheel.io/sdk/extension/flywheel-extension-0.14.9.min.js"></script>
  <script>
    // Container types that ITK-SNAP's fw:// direct URL form understands
    const SUPPORTED = {
      acquisition: 'acquisitions', analysis: 'analyses', session: 'sessions',
      subject: 'subjects', project: 'projects'
    };

    // Image file extensions ITK-SNAP can open. Companion data files
    // (.raw, .img, .img.gz) are left out; open their header instead.
    const IMAGE_EXTS = [
      '.nii', '.nii.gz', '.nia', '.nia.gz', '.nrrd', '.nhdr', '.mha', '.mhd', '.hdr',
      '.mnc', '.gipl', '.gipl.gz', '.vtk', '.vti', '.cub', '.cub.gz', '.dcm', '.ge4', '.ge5', '.ima'
    ];
    const WORKSPACE_EXT = '.itksnap';

    // How long to wait after launching ITK-SNAP before closing the frame
    const CLOSE_DELAY_MS = 250;

    const status = document.getElementById('status');

    // Origin of the Flywheel frame that connects to us, captured by validateOrigin
    let hostOrigin = null;

    let extension = null;

    // Resize the frame to the height of its content
    function fitHeight() {
      if (extension)
        extension.updateViewport({ height: Math.ceil(document.body.getBoundingClientRect().height) });
    }

    function fail(msg) {
      document.getElementById('list').hidden = true;
      status.textContent = msg;
      status.className = 'error';
      fitHeight();
    }

    // Host name of the Flywheel instance. An explicit 'server' application
    // option wins; otherwise use the origin of the frame that connected to us.
    function flywheelHost(extension) {
      if (extension.params && extension.params.server)
        return extension.params.server;
      if (hostOrigin)
        return new URL(hostOrigin).host;
      if (location.ancestorOrigins && location.ancestorOrigins.length)
        return new URL(location.ancestorOrigins[0]).host;
      if (document.referrer)
        return new URL(document.referrer).host;
      return null;
    }

    function hasExt(name, exts) {
      const lower = name.toLowerCase();
      return exts.some(ext => lower.endsWith(ext));
    }

    // The image extension of a file name, e.g. '.nii.gz' (the longest match)
    function imageExt(name) {
      const lower = name.toLowerCase();
      return IMAGE_EXTS.filter(ext => lower.endsWith(ext))
        .reduce((best, ext) => ext.length > best.length ? ext : best, '');
    }

    function formatSize(bytes) {
      if (bytes == null) return '';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let i = 0;
      while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
      return (i === 0 ? bytes : bytes.toFixed(1)) + ' ' + units[i];
    }

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return isNaN(d) ? '' : d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    // Human-readable name of a container type
    const TYPE_LABEL = {
      acquisition: 'Acquisition', analysis: 'Analysis', session: 'Session',
      subject: 'Subject', project: 'Project'
    };

    // Child container types whose files are listed along with the container's
    // own. Only sessions are expanded: subjects and projects can hold far too
    // many acquisitions to list.
    const CHILD_TYPES = { session: ['acquisition', 'analysis'] };

    const byName = (a, b) =>
      String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' });

    // Fill one section of the list with links to the given items ({file, source}).
    // Items are grouped under a subheading per source container when they come
    // from more than one container.
    function renderSection(listId, countId, items, emptyText) {
      const ul = document.getElementById(listId);
      document.getElementById(countId).textContent = `(${items.length})`;
      ul.replaceChildren();
      if (!items.length) {
        const li = document.createElement('li');
        li.className = 'empty';
        li.textContent = emptyText;
        ul.append(li);
        return;
      }

      const showSources = new Set(items.map(it => it.source)).size > 1;
      let lastSource = null, group = -1;
      for (const { file, source } of items) {
        if (source !== lastSource) {
          group++;
          lastSource = source;
          if (showSources) {
            const h = document.createElement('li');
            h.className = 'source';
            h.dataset.group = group;
            h.textContent = source.heading;
            ul.append(h);
          }
        }

        const a = document.createElement('a');
        a.href = source.urlFor(file);
        a.title = `Open ${file.name} in ITK-SNAP`;

        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = file.name;

        const meta = document.createElement('span');
        meta.className = 'meta';
        meta.textContent = [formatSize(file.size), formatDate(file.modified)].filter(Boolean).join(' · ');

        a.append(name, meta);

        // The browser follows the itksnap-fw:// link and hands it to ITK-SNAP;
        // then close the frame.
        a.addEventListener('click', () => {
          status.textContent = `Opening ${file.name} in ITK-SNAP…`;
          status.className = '';
          fitHeight();
          setTimeout(() => extension.close(), CLOSE_DELAY_MS);
        });

        const li = document.createElement('li');
        li.dataset.group = group;
        li.dataset.ext = imageExt(file.name);
        li.append(a);
        ul.append(li);
      }
    }

    // Image types the viewer has switched off, remembered across runs
    const HIDDEN_EXTS_KEY = 'itksnap-launcher:prefs:hidden-exts';
    let hiddenExts = new Set();
    try { hiddenExts = new Set(JSON.parse(localStorage.getItem(HIDDEN_EXTS_KEY)) || []); } catch (err) {}

    function saveHiddenExts() {
      try { localStorage.setItem(HIDDEN_EXTS_KEY, JSON.stringify([...hiddenExts])); } catch (err) {}
    }

    // Build a toggle per image extension in the list. Shown only when there
    // is more than one extension to choose from.
    function buildExtFilter(images) {
      const counts = new Map();
      for (const { file } of images) {
        const ext = imageExt(file.name);
        counts.set(ext, (counts.get(ext) || 0) + 1);
      }
      const box = document.getElementById('ext-filter');
      box.replaceChildren();
      box.hidden = counts.size < 2;
      for (const [ext, n] of [...counts].sort((a, b) => b[1] - a[1] || byName(a[0], b[0]))) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.dataset.ext = ext;
        chip.setAttribute('aria-pressed', String(!hiddenExts.has(ext)));
        const count = document.createElement('span');
        count.className = 'n';
        count.textContent = n;
        chip.append(ext, count);
        chip.addEventListener('click', () => {
          if (hiddenExts.has(ext)) hiddenExts.delete(ext); else hiddenExts.add(ext);
          chip.setAttribute('aria-pressed', String(!hiddenExts.has(ext)));
          saveHiddenExts();
          applyExtFilter();
        });
        box.append(chip);
      }
      applyExtFilter();
    }

    // Show only images of the switched-on extensions, and only the container
    // headings that still have images under them. Nothing is filtered when
    // the toggles are not shown.
    function applyExtFilter() {
      const active = !document.getElementById('ext-filter').hidden;
      const rows = [...document.querySelectorAll('#images li[data-ext]')];
      const visibleGroups = new Set();
      let shown = 0;
      for (const li of rows) {
        li.hidden = active && hiddenExts.has(li.dataset.ext);
        if (!li.hidden) { shown++; visibleGroups.add(li.dataset.group); }
      }
      for (const h of document.querySelectorAll('#images li.source'))
        h.hidden = !visibleGroups.has(h.dataset.group);
      document.getElementById('img-count').textContent =
        shown === rows.length ? `(${rows.length})` : `(${shown} of ${rows.length})`;
      document.getElementById('img-none').hidden = !rows.length || shown > 0;
      fitHeight();
    }

    // A container with its file list. Containers that already carry their
    // files (the one Flywheel passed in, or children from a listing that
    // includes files) are used as they are; others are fetched.
    async function withFiles(type, container) {
      if (Array.isArray(container.files))
        return container;
      try {
        const full = await extension.getContainer(type, container._id);
        if (full && Array.isArray(full.files))
          return full;
      } catch (err) {
        console.warn(`Could not fetch ${type} ${container._id}:`, err);
      }
      return container;
    }

    // Child containers of the given type. A failure (e.g. the host refusing
    // the listing) only drops those children from the list.
    async function children(parent, type) {
      try {
        const result = await extension.getChildContainers(parent, type);
        const list = Array.isArray(result) ? result : (result && result.results) || [];
        return list.filter(c => c && c._id);
      } catch (err) {
        console.warn(`Could not list ${type} containers of ${parent.container_type} ${parent._id}:`, err);
        return [];
      }
    }

    const isListed = name => hasExt(name, [WORKSPACE_EXT]) || hasExt(name, IMAGE_EXTS);

    // The containers whose files are listed, as plain data that can be cached:
    // this one first, then its children, by type and then by label. Only the
    // files the list shows are kept.
    async function gatherSources(container) {
      const type = container.container_type;
      const childLists = await Promise.all((CHILD_TYPES[type] || []).map(async ct =>
        Promise.all((await children(container, ct))
          .sort((a, b) => byName(a.label, b.label))
          .map(c => withFiles(ct, c).then(full => ({ type: ct, container: full }))))));
      return [{ type, container: await withFiles(type, container) }, ...childLists.flat()]
        .map(({ type, container: c }) => ({
          type, id: c._id, label: c.label || '',
          files: (c.files || [])
            .filter(f => f && f.name && isListed(f.name))
            .map(f => ({ name: f.name, size: f.size, modified: f.modified }))
            .sort((a, b) => byName(a.name, b.name))
        }));
    }

    // Browser cache of each container's list, so a repeat run shows it at
    // once while the fresh list loads. Storage can be unavailable (blocked
    // third-party storage, private windows), in which case nothing is cached.
    const CACHE_PREFIX = 'itksnap-launcher:v1:';
    const CACHE_MAX_ENTRIES = 100;

    function cacheKey(host, container) {
      return `${CACHE_PREFIX}${host}:${container.container_type}:${container._id}`;
    }

    function loadCache(key) {
      try {
        const entry = JSON.parse(localStorage.getItem(key));
        return entry && Array.isArray(entry.sources) ? entry.sources : null;
      } catch (err) {
        return null;
      }
    }

    function saveCache(key, sources) {
      try {
        localStorage.setItem(key, JSON.stringify({ time: Date.now(), sources }));
        // Drop the oldest entries beyond the limit
        const entries = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(CACHE_PREFIX)) {
            let time = 0;
            try { time = JSON.parse(localStorage.getItem(k)).time || 0; } catch (err) {}
            entries.push({ k, time });
          }
        }
        entries.sort((a, b) => b.time - a.time).slice(CACHE_MAX_ENTRIES)
          .forEach(e => localStorage.removeItem(e.k));
      } catch (err) {
        console.warn('Could not cache the file list:', err);
      }
    }

    // Show the list for the given sources. Returns false if there is nothing to show.
    function render(host, type, sources, refreshing) {
      const decorated = sources.map((s, i) => ({
        heading: i === 0 ? `This ${type}` : `${TYPE_LABEL[s.type]}: ${s.label || s.id}`,
        urlFor: file =>
          `itksnap-fw://${host}/${SUPPORTED[s.type]}/${s.id}/files/${encodeURIComponent(file.name)}`,
        files: s.files
      }));
      const items = decorated.flatMap(source => source.files.map(file => ({ file, source })));
      const workspaces = items.filter(it => hasExt(it.file.name, [WORKSPACE_EXT]));
      const images = items.filter(it => hasExt(it.file.name, IMAGE_EXTS));
      if (!workspaces.length && !images.length)
        return false;

      status.textContent = '';
      document.getElementById('refreshing').hidden = !refreshing;
      renderSection('workspaces', 'ws-count', workspaces, `No workspaces in this ${type}`);
      renderSection('images', 'img-count', images, `No images in this ${type}`);
      buildExtFilter(images);
      document.getElementById('list').hidden = false;
      fitHeight();
      return true;
    }

    Flywheel.initExtension({
      validateOrigin: origin => { hostOrigin = hostOrigin || origin; return true; }
    }).then(async ext => {
      extension = ext;

      const container = extension.container;
      if (!container)
        return fail('This application must be invoked on a container.');

      const type = container.container_type;
      if (!SUPPORTED[type])
        return fail(`ITK-SNAP cannot open files from a ${type} container.`);

      const host = flywheelHost(extension);
      if (!host)
        return fail('Could not determine the Flywheel server name.');

      // Show the cached list right away, if there is one, then refresh it
      const key = cacheKey(host, container);
      const cached = loadCache(key);
      const shown = cached && render(host, type, cached, true);
      if (!shown) {
        status.textContent = 'Looking for images and workspaces…';
        fitHeight();
      }

      const sources = await gatherSources(container);
      saveCache(key, sources);

      if (shown && JSON.stringify(sources) === JSON.stringify(cached)) {
        document.getElementById('refreshing').hidden = true;
        return;
      }
      if (!render(host, type, sources, false))
        fail(`This ${type} has no ITK-SNAP workspaces or images that ITK-SNAP can open.`);
    }).catch(err => fail('Failed to connect to Flywheel: ' + err));
  </script>
</body>
</html>
