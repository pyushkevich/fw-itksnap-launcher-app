<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Open in ITK-SNAP</title>
  <style>
    /* Transparent and empty until connected, so the initial full-size frame shows nothing */
    html, body { background: transparent; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 12px 24px; color: #222; font-size: 14px; }
    p { margin: 0; }
    .error { color: #b00020; }
    .hint { color: #666; margin-bottom: 8px; }

    #list[hidden] { display: none; }
    section { margin-bottom: 14px; }
    h2 {
      font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
      color: #555; margin: 0 0 4px; padding-bottom: 3px; border-bottom: 1px solid #ddd;
    }
    h2 .count { font-weight: 400; color: #888; }
    ul { list-style: none; margin: 0; padding: 0; }
    li a {
      display: flex; align-items: baseline; gap: 12px;
      padding: 5px 8px; border-radius: 4px; color: #1a56a8; text-decoration: none;
    }
    li a:hover, li a:focus-visible { background: #eaf1fb; outline: none; }
    .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .meta { color: #888; font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    li.source { color: #555; font-size: 12px; font-weight: 600; padding: 8px 8px 2px; }
    .empty { color: #888; font-style: italic; padding: 5px 8px; }
  </style>
</head>
<body>
  <p id="status"></p>

  <div id="list" hidden>
    <p class="hint">Choose a workspace or image to open in ITK-SNAP.</p>
    <section>
      <h2>ITK-SNAP workspaces <span class="count" id="ws-count"></span></h2>
      <ul id="workspaces"></ul>
    </section>
    <section>
      <h2>Images <span class="count" id="img-count"></span></h2>
      <ul id="images"></ul>
    </section>
  </div>

  <script src="https://cdn.flywheel.io/sdk/extension/flywheel-extension-0.14.9.min.js"></script>
  <script>
    // Container types that ITK-SNAP's fw:// direct URL form understands
    const SUPPORTED = {
      acquisition: 'acquisitions', analysis: 'analyses', session: 'sessions',
      subject: 'subjects', project: 'projects'
    };

    // Image file extensions ITK-SNAP can open. Companion data files
    // (.raw, .img, .img.gz) are left out; open their header instead.
    const IMAGE_EXTS = [
      '.nii', '.nii.gz', '.nia', '.nia.gz', '.nrrd', '.nhdr', '.mha', '.mhd', '.hdr',
      '.mnc', '.gipl', '.gipl.gz', '.vtk', '.vti', '.cub', '.cub.gz', '.dcm', '.ge4', '.ge5', '.ima'
    ];
    const WORKSPACE_EXT = '.itksnap';

    // How long to wait after launching ITK-SNAP before closing the frame
    const CLOSE_DELAY_MS = 250;

    const status = document.getElementById('status');

    // Origin of the Flywheel frame that connects to us, captured by validateOrigin
    let hostOrigin = null;

    let extension = null;

    // Resize the frame to the height of its content
    function fitHeight() {
      if (extension)
        extension.updateViewport({ height: Math.ceil(document.body.getBoundingClientRect().height) });
    }

    function fail(msg) {
      document.getElementById('list').hidden = true;
      status.textContent = msg;
      status.className = 'error';
      fitHeight();
    }

    // Host name of the Flywheel instance. An explicit 'server' application
    // option wins; otherwise use the origin of the frame that connected to us.
    function flywheelHost(extension) {
      if (extension.params && extension.params.server)
        return extension.params.server;
      if (hostOrigin)
        return new URL(hostOrigin).host;
      if (location.ancestorOrigins && location.ancestorOrigins.length)
        return new URL(location.ancestorOrigins[0]).host;
      if (document.referrer)
        return new URL(document.referrer).host;
      return null;
    }

    function hasExt(name, exts) {
      const lower = name.toLowerCase();
      return exts.some(ext => lower.endsWith(ext));
    }

    function formatSize(bytes) {
      if (bytes == null) return '';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      let i = 0;
      while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
      return (i === 0 ? bytes : bytes.toFixed(1)) + ' ' + units[i];
    }

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return isNaN(d) ? '' : d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    // Human-readable name of a container type
    const TYPE_LABEL = {
      acquisition: 'Acquisition', analysis: 'Analysis', session: 'Session',
      subject: 'Subject', project: 'Project'
    };

    // Child container types whose files are listed along with the container's
    // own. Only sessions are expanded: subjects and projects can hold far too
    // many acquisitions to list.
    const CHILD_TYPES = { session: ['acquisition', 'analysis'] };

    const byName = (a, b) =>
      String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' });

    // Fill one section of the list with links to the given items ({file, source}).
    // Items are grouped under a subheading per source container when they come
    // from more than one container.
    function renderSection(listId, countId, items, emptyText) {
      const ul = document.getElementById(listId);
      document.getElementById(countId).textContent = `(${items.length})`;
      ul.replaceChildren();
      if (!items.length) {
        const li = document.createElement('li');
        li.className = 'empty';
        li.textContent = emptyText;
        ul.append(li);
        return;
      }

      const showSources = new Set(items.map(it => it.source)).size > 1;
      let lastSource = null;
      for (const { file, source } of items) {
        if (showSources && source !== lastSource) {
          const h = document.createElement('li');
          h.className = 'source';
          h.textContent = source.heading;
          ul.append(h);
          lastSource = source;
        }

        const a = document.createElement('a');
        a.href = source.urlFor(file);
        a.title = `Open ${file.name} in ITK-SNAP`;

        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = file.name;

        const meta = document.createElement('span');
        meta.className = 'meta';
        meta.textContent = [formatSize(file.size), formatDate(file.modified)].filter(Boolean).join(' · ');

        a.append(name, meta);

        // The browser follows the itksnap-fw:// link and hands it to ITK-SNAP;
        // then close the frame.
        a.addEventListener('click', () => {
          status.textContent = `Opening ${file.name} in ITK-SNAP…`;
          status.className = '';
          fitHeight();
          setTimeout(() => extension.close(), CLOSE_DELAY_MS);
        });

        const li = document.createElement('li');
        li.append(a);
        ul.append(li);
      }
    }

    // A container with its file list. Fetch the container fresh, so the list
    // includes files added since the page loaded (and so child containers from
    // a listing that omits files get them); fall back to the copy we have.
    async function withFiles(type, container) {
      try {
        const fresh = await extension.getContainer(type, container._id);
        if (fresh && Array.isArray(fresh.files))
          return fresh;
      } catch (err) {
        console.warn(`Could not fetch ${type} ${container._id}:`, err);
      }
      return container;
    }

    // Child containers of the given type. A failure (e.g. the host refusing
    // the listing) only drops those children from the list.
    async function children(parent, type) {
      try {
        const result = await extension.getChildContainers(parent, type);
        const list = Array.isArray(result) ? result : (result && result.results) || [];
        return list.filter(c => c && c._id);
      } catch (err) {
        console.warn(`Could not list ${type} containers of ${parent.container_type} ${parent._id}:`, err);
        return [];
      }
    }

    Flywheel.initExtension({
      validateOrigin: origin => { hostOrigin = hostOrigin || origin; return true; }
    }).then(async ext => {
      extension = ext;

      const container = extension.container;
      if (!container)
        return fail('This application must be invoked on a container.');

      const type = container.container_type;
      if (!SUPPORTED[type])
        return fail(`ITK-SNAP cannot open files from a ${type} container.`);

      const host = flywheelHost(extension);
      if (!host)
        return fail('Could not determine the Flywheel server name.');

      status.textContent = 'Looking for images and workspaces…';
      fitHeight();

      // The containers whose files are listed: this one first, then its
      // children, by type and then by label
      const childTypes = CHILD_TYPES[type] || [];
      const childLists = await Promise.all(childTypes.map(async ct =>
        Promise.all((await children(container, ct))
          .sort((a, b) => byName(a.label, b.label))
          .map(c => withFiles(ct, c).then(full => ({ type: ct, container: full }))))));
      const sources = [{ type, container: await withFiles(type, container) }, ...childLists.flat()]
        .map(({ type, container: c }, i) => ({
          order: i,
          heading: i === 0 ? `This ${type}` : `${TYPE_LABEL[type]}: ${c.label || c._id}`,
          files: (c.files || []).filter(f => f && f.name).sort((a, b) => byName(a.name, b.name)),
          urlFor: file =>
            `itksnap-fw://${host}/${SUPPORTED[type]}/${c._id}/files/${encodeURIComponent(file.name)}`
        }));

      const items = sources.flatMap(source => source.files.map(file => ({ file, source })));
      const workspaces = items.filter(it => hasExt(it.file.name, [WORKSPACE_EXT]));
      const images = items.filter(it => hasExt(it.file.name, IMAGE_EXTS));

      status.textContent = '';
      if (!workspaces.length && !images.length)
        return fail(`This ${type} has no ITK-SNAP workspaces or images that ITK-SNAP can open.`);

      renderSection('workspaces', 'ws-count', workspaces, `No workspaces in this ${type}`);
      renderSection('images', 'img-count', images, `No images in this ${type}`);
      document.getElementById('list').hidden = false;
      fitHeight();
    }).catch(err => fail('Failed to connect to Flywheel: ' + err));
  </script>
</body>
</html>
